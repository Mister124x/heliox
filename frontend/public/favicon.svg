<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente del núcleo solar ultra brillante -->
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FFDD33"/>
      <stop offset="55%" stop-color="#FF7700"/>
      <stop offset="85%" stop-color="#DD1100"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>

    <!-- Resplandor exterior de la corona -->
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8800" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FF3300" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#FF0055" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de los bucles magnéticos -->
    <linearGradient id="magneticLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF7700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0088" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="flareBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Espacial Oscuro Redondeado -->
  <rect width="512" height="512" rx="110" fill="#05050A"/>

  <!-- Halo de la Corona Solar -->
  <circle cx="256" cy="256" r="230" fill="url(#coronaGlow)" filter="url(#flareBloom)"/>

  <!-- Rayos y Bucles de Plasma Magnético (Prominencias Solares) -->
  <!-- Bucle Superior Derecho -->
  <path d="M 256 70 C 370 70 430 150 430 256" fill="none" stroke="url(#magneticLoop)" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#solarGlow)"/>
  <!-- Bucle Inferior Izquierdo -->
  <path d="M 256 442 C 142 442 82 362 82 256" fill="none" stroke="url(#magneticLoop)" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#solarGlow)"/>
  <!-- Bucle Transversal Orbitante (Órbita de Telemetría) -->
  <ellipse cx="256" cy="256" rx="205" ry="85" transform="rotate(-30 256 256)" fill="none" stroke="url(#magneticLoop)" stroke-width="4.5" stroke-dasharray="14 10" opacity="0.75"/>

  <!-- Rayos de Llamaradas Clase X -->
  <line x1="256" y1="26" x2="256" y2="76" stroke="#FFCC00" stroke-width="5" stroke-linecap="round" filter="url(#solarGlow)"/>
  <line x1="256" y1="436" x2="256" y2="486" stroke="#FF5500" stroke-width="5" stroke-linecap="round" filter="url(#solarGlow)"/>
  <line x1="26" y1="256" x2="76" y2="256" stroke="#FF7700" stroke-width="5" stroke-linecap="round" filter="url(#solarGlow)"/>
  <line x1="436" y1="256" x2="486" y2="256" stroke="#FFCC00" stroke-width="5" stroke-linecap="round" filter="url(#solarGlow)"/>

  <!-- Rayos Diagonales -->
  <line x1="93" y1="93" x2="130" y2="130" stroke="#FF8800" stroke-width="4" stroke-linecap="round"/>
  <line x1="419" y1="419" x2="382" y2="382" stroke="#FF4400" stroke-width="4" stroke-linecap="round"/>
  <line x1="419" y1="93" x2="382" y2="130" stroke="#FFAA00" stroke-width="4" stroke-linecap="round"/>
  <line x1="93" y1="419" x2="130" y2="382" stroke="#FF3300" stroke-width="4" stroke-linecap="round"/>

  <!-- Núcleo Solar Esférico -->
  <circle cx="256" cy="256" r="140" fill="url(#sunCore)" filter="url(#solarGlow)"/>

  <!-- Satélite de Observación en Órbita -->
  <g transform="translate(415, 160) rotate(25)">
    <!-- Cuerpo del Satélite -->
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#D8D8E0" stroke="#FFF" stroke-width="1.5"/>
    <!-- Panel Solar Izquierdo -->
    <rect x="-32" y="-6" width="18" height="12" rx="2" fill="#0066CC" stroke="#00AAFF" stroke-width="1.5"/>
    <line x1="-23" y1="-6" x2="-23" y2="6" stroke="#00AAFF" stroke-width="1"/>
    <!-- Panel Solar Derecho -->
    <rect x="14" y="-6" width="18" height="12" rx="2" fill="#0066CC" stroke="#00AAFF" stroke-width="1.5"/>
    <line x1="23" y1="-6" x2="23" y2="6" stroke="#00AAFF" stroke-width="1"/>
    <!-- Punto de señal / Telemetría -->
    <circle cx="0" cy="0" r="3" fill="#00FF66" filter="url(#solarGlow)"/>
  </g>

  <!-- Letra Emblemática 'H' Estilizada en el Centro del Sol (HELIOX) -->
  <path d="M 218 190 L 218 322 M 294 190 L 294 322 M 218 256 L 294 256" 
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.95" filter="url(#solarGlow)"/>
</svg>
