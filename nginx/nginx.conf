events { worker_connections 1024; }

http {
    # ─── Configuración general ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # ─── Upstream ─────────────────────────────────────────────────────────
    upstream api_backend  { server api:8000; }
    upstream next_frontend { server frontend:3000; }

    # ─── Redirigir HTTP → HTTPS ───────────────────────────────────────────
    server {
        listen 80;
        server_name heliox.jesusbarrios.co;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name heliox.jesusbarrios.co;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # ─── API Backend ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;

            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        }

        # ─── WebSocket ───────────────────────────────────────────────────
        location /api/storms/ws/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ─── Docs FastAPI ─────────────────────────────────────────────────
        location /docs { proxy_pass http://api_backend; }
        location /redoc { proxy_pass http://api_backend; }
        location /openapi.json { proxy_pass http://api_backend; }

        # ─── Frontend Next.js ─────────────────────────────────────────────
        location / {
            proxy_pass http://next_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Headers de seguridad
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options SAMEORIGIN;
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }
    }
}
